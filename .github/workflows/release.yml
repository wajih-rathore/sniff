name: Release
# Builds the Sniff installers on each system with scripts/build-desktop.ps1: the NSIS .exe on Windows, a .dmg for
# Apple Silicon and one for Intel Macs, and an AppImage and a .deb on Linux. Every run keeps them as workflow
# artifacts; a tag v* also puts them on a draft GitHub release for Wajih to check and publish.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
          - os: macos-15        # Apple Silicon (arm64). macos-14 was retired on 2 Nov 2026.
            bundles: dmg
          - os: macos-15-intel  # Intel (x64), GitHub's last Intel image (until Aug 2027). macos-13 was retired in Dec 2025.
            bundles: dmg
          - os: ubuntu-22.04    # the oldest glibc GitHub still offers, so the AppImage runs on more distributions
            bundles: appimage,deb
    runs-on: ${{ matrix.os }}
    env:
      # PyInstaller needs a Python with a shared libpython: use the one setup-python installs, not a uv-managed one
      UV_PYTHON: "3.12"
      UV_PYTHON_PREFERENCE: only-system
    steps:
      - uses: actions/checkout@v4
      - name: Linux libraries for Tauri (WebKitGTK, tray, icons) and for the AppImage
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf xdg-utils file
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.5.31"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Build (llama-server b12628 with its sha256 checked, frozen back end, front end, Tauri bundle)
        shell: pwsh
        run: ./scripts/build-desktop.ps1 -Bundles '${{ matrix.bundles }}'
      - uses: actions/upload-artifact@v4
        with:
          name: sniff-${{ matrix.os }}
          path: |
            .cache/cargo-target/release/bundle/nsis/*.exe
            .cache/cargo-target/release/bundle/dmg/*.dmg
            .cache/cargo-target/release/bundle/appimage/*.AppImage
            .cache/cargo-target/release/bundle/deb/*.deb
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write  # creates the draft release
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Draft release with every installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --draft --generate-notes --repo "$GITHUB_REPOSITORY"
