name: Release
# Builds the Sniff installers on each system with scripts/build-desktop.ps1: the NSIS .exe on Windows, a .dmg for
# Apple Silicon and one for Intel Macs, and an AppImage and a .deb on Linux. Every run keeps them as workflow
# artifacts; a tag v* also puts them on a draft GitHub release for Wajih to check and publish.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
          - os: macos-15        # Apple Silicon (arm64). macos-14 was retired on 2 Nov 2026.
            bundles: dmg
          - os: macos-15-intel  # Intel (x64), GitHub's last Intel image (until Aug 2027). macos-13 was retired in Dec 2025.
            bundles: dmg
          - os: ubuntu-22.04    # the oldest glibc GitHub still offers, so the AppImage runs on more distributions
            bundles: appimage,deb
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      # PyInstaller needs a Python with a shared libpython: use the one setup-python installs, not a uv-managed one.
      # Except on macOS, where that one cannot load sqlite-vec: build-desktop.ps1 uses uv's own Python there (issue #18).
      UV_PYTHON: "3.12"
      UV_PYTHON_PREFERENCE: only-system
    steps:
      - uses: actions/checkout@v4
      - name: Linux libraries for Tauri (WebKitGTK, tray, icons) and for the AppImage
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf xdg-utils file
      - uses: actions/setup-python@v5
        if: runner.os != 'macOS'
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.5.31"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Build (llama-server b12628 with its sha256 checked, frozen back end, front end, Tauri bundle)
        shell: pwsh
        run: ./scripts/build-desktop.ps1 -Bundles '${{ matrix.bundles }}'
      - name: Smoke test (the back end, as built and as shipped, runs OCR, opens a database and loads sqlite-vec)
        if: ${{ !cancelled() }}  # also after a failed Tauri bundle, to tell the two failures apart
        shell: bash
        run: |
          desktop/build/sniff-backend/sniff-backend --check  # as PyInstaller made it (on Windows the only check: the installer is not unpacked)
          b=.cache/cargo-target/release/bundle
          if [ "$RUNNER_OS" = macOS ]; then  # Tauri deletes the .app once the .dmg is made, so test the one in the .dmg
            m=$(mktemp -d) && hdiutil attach -nobrowse -readonly -mountpoint "$m" "$b"/dmg/*.dmg > /dev/null
            "$m/Sniff.app/Contents/Resources/backend/sniff-backend" --check
            hdiutil detach "$m" > /dev/null
          fi
          if [ "$RUNNER_OS" = Linux ]; then
            (cd "$RUNNER_TEMP" && "$GITHUB_WORKSPACE/$b"/appimage/*.AppImage --appimage-extract > /dev/null)
            "$RUNNER_TEMP/squashfs-root/usr/lib/Sniff/backend/sniff-backend" --check
            dpkg-deb -x "$b"/deb/*.deb "$RUNNER_TEMP/deb"
            "$RUNNER_TEMP/deb/usr/lib/Sniff/backend/sniff-backend" --check
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: sniff-${{ matrix.os }}
          path: |
            .cache/cargo-target/release/bundle/nsis/*.exe
            .cache/cargo-target/release/bundle/dmg/*.dmg
            .cache/cargo-target/release/bundle/appimage/*.AppImage
            .cache/cargo-target/release/bundle/deb/*.deb
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write  # creates the draft release
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Draft release with every installer
        env:
          GH_TOKEN: ${{ github.token }}
        # each bundle keeps its folder (dist/nsis/, dist/dmg/, ...), so pass the files
        run: gh release create "$GITHUB_REF_NAME" $(find dist -type f) --draft --generate-notes --repo "$GITHUB_REPOSITORY"
