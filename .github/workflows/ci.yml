name: CI
on: [push, pull_request]

jobs:
  backend:
    # the team uses all three systems, so the tests run on each
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # uv's own Python on every system: the one GitHub's macOS machines have cannot load sqlite-vec (issue #18)
      UV_PYTHON_PREFERENCE: only-managed
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.5.31"
      - run: uv sync
      - run: uv run pytest -q   # fake models only, no servers needed

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
