[package]
name = "sniff"
version = "0.1.0"
description = "Sniff desktop app: launcher window, tray icon, and the back end and model servers as child processes"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# macos-private-api: a transparent window on macOS, which the vibrancy backdrop needs (no effect on other systems)
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# start at sign-in on macOS and Linux; Windows writes its own Run-key value (src/platform.rs)
[target.'cfg(not(windows))'.dependencies]
tauri-plugin-autostart = "2"

[profile.release]
strip = true
