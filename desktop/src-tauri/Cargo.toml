[package]
name = "sniff"
version = "0.1.0"
description = "Sniff desktop app: launcher window, tray icon, and the back end and model servers as child processes"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"

[profile.release]
strip = true
