[project]
name = "sniff"
version = "0.1.0"
description = "Local search, facts and reminders for the documents on your laptop"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic>=2",
    "pymupdf",
    "python-docx",
    "python-pptx",
    "rapidocr-onnxruntime",
    "sqlite-vec",
    "openai",
    "mcp",
    "google-api-python-client",
    "google-auth-oauthlib",
    "watchdog>=7.1.1",
    "keyring>=25.7.0",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx",
    "reportlab",
    "faker",
    "pillow",
    "pytesseract",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sniff"]

[tool.uv]
# Intel Macs: the last releases with wheels for them (newer ones need a slow source build, or fail it). The second
# line of each pair keeps the newer release on every other system.
constraint-dependencies = [
    "onnxruntime<1.24; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "onnxruntime>=1.24; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "pymupdf<2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "pymupdf>=2; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "cryptography<49; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "cryptography>=49; sys_platform != 'darwin' or platform_machine != 'x86_64'",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
